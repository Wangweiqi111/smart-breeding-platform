<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 - 智慧养殖平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 导航栏 -->
<div class="nav">
  <a href="index.html">首页</a>
  <a href="system.html">养殖系统</a>
  <b>登录</b>
  <a href="register.html">注册</a>
  <span class="nav-user" id="navUser"></span>
</div>

<div class="auth-box">
  <h2>用户登录</h2>
  <p class="tip">登录后可保存自己的存栏数据与环境记录</p>

  <div class="msg" id="msg"></div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="username">账号</label>
      <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">
    </div>

    <label class="remember">
      <input type="checkbox" id="remember">
      记住密码（保存在本机浏览器，公用电脑请勿勾选）
    </label>

    <button type="submit">登 录</button>
  </form>

  <p class="auth-link">还没有账号？<a href="register.html">立即注册</a></p>
  <p class="auth-link" style="margin-top:6px">
    演示账号：<b>demo</b> / 密码 <b>123456</b>
  </p>
</div>

<div class="footer">
  <p>智慧养殖平台 © 2026</p>
</div>

<script src="app.js"></script>
<script>
(function () {
  const form = document.getElementById('loginForm');
  const u = document.getElementById('username');
  const p = document.getElementById('password');
  const r = document.getElementById('remember');
  const msg = document.getElementById('msg');

  function show(text, type) {
    msg.textContent = text;
    msg.className = 'msg show ' + type;
  }

  // 回填“记住密码”保存的账号
  const saved = SBP.remembered();
  if (saved) {
    u.value = saved.username || '';
    p.value = saved.password || '';
    r.checked = true;
  } else {
    // 刚注册完跳过来时，自动填好用户名
    const pre = sessionStorage.getItem('sbp_prefill');
    if (pre) { u.value = pre; sessionStorage.removeItem('sbp_prefill'); p.focus(); }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!u.value.trim())  return show('请输入账号', 'err');
    if (!p.value)         return show('请输入密码', 'err');

    const res = await SBP.login(u.value, p.value, r.checked);
    if (!res.ok) return show(res.msg, 'err');

    show(res.msg + '，正在进入养殖系统…', 'ok');
    setTimeout(() => { location.href = 'system.html'; }, 600);
  });
})();
</script>
</body>
</html>
